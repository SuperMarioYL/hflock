<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="hflock m1 architecture: lockfile to verify to manifest, m2 mirrors dormant">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <text x="24" y="30" font-size="12" font-weight="500" fill="#6E6E73">hflock · m1 flow</text>

  <!-- static base connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="212" y1="180" x2="352" y2="180" marker-end="url(#ah-l)"/>
    <line x1="527" y1="180" x2="667" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (m1: lockfile -> verify -> manifest) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="212" y1="180" x2="352" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="527" y1="180" x2="667" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M212,180 L352,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M527,180 L667,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- m2 branch: dormant mirror targets (no flow in m1) -->
  <line x1="440" y1="220" x2="440" y2="275" stroke="#C9C9D0" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>
  <rect x="355" y="275" width="170" height="46" rx="12" fill="#6E6E73" fill-opacity="0.08" stroke="#C9C9D0" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="440" y="299" text-anchor="middle" font-size="12" font-weight="500" fill="#6E6E73">Gitee AI · ModelScope</text>
  <text x="440" y="314" text-anchor="middle" font-size="10" fill="#6E6E73">(m2 mirror sync)</text>

  <!-- nodes -->
  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">lockfile</text>
    <text x="125" y="194" text-anchor="middle" font-size="11" fill="#6E6E73">weights.lock.yaml</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">verify</text>
    <text x="440" y="194" text-anchor="middle" font-size="11" fill="#6E6E73">download + SHA256</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">manifest</text>
    <text x="755" y="194" text-anchor="middle" font-size="11" fill="#6E6E73">manifest.json</text>
  </g>
</svg>
